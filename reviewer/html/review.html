<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
<link rel="stylesheet" href="assets/style.css?v=20261021c">
</head>
<body>
<div id="review-wrap">
    <div id="toolbar">
        <button type="button" class="btn" data-switch-mode="browse">Browse</button>
        <span class="toolbar-label">Reviewer</span>
        <select id="reviewer-select" class="reviewer-select"></select>
        <button type="button" class="btn save" id="save-review">Save Review</button>
        <span class="toolbar-label">Filters</span>
        <button type="button" class="filter-toggle active" data-filter="go">Go</button>
        <button type="button" class="filter-toggle active" data-filter="nogo">No-go</button>
        <button type="button" class="filter-toggle active" data-filter="undecided">Undecided</button>
        <button type="button" class="filter-toggle" data-filter="last">last</button>
    </div>

    <div id="nav-bar">
        <button type="button" id="nav-first" title="First">&#x21E4;</button>
        <button type="button" id="nav-prev" title="Previous">&#x276E;</button>
        <span id="nav-counter">-/-</span>
        <button type="button" id="nav-next" title="Next">&#x276F;</button>
        <button type="button" id="nav-last" title="Last">&#x21E5;</button>
        <span id="nav-student"><span class="nav-name" id="nav-name"></span> <span class="nav-supervisor" id="nav-supervisor"></span></span>
        <span id="nav-version"></span>
    </div>

    <div id="review-fields">
        <div class="field checks-row">
            <div>
                <span class="field-label">Format</span>
                <span id="format-check"></span>
            </div>
            <div id="ai-review-section" class="ai-only">
                <span class="field-label">AI review</span>
                <div id="ai-check"></div>
            </div>
            <div>
                <span class="field-label">Verdict</span>
                <span id="verdict"></span>
            </div>
        </div>
        <div class="field">
            <label for="reviews-summary">Reviews</label>
            <textarea id="reviews-summary" rows="7" readonly placeholder="No reviews yet."></textarea>
        </div>
        <div class="field">
            <label for="notes" id="notes-label">Review Notes</label>
            <textarea id="notes" rows="7" placeholder="Write your review notes here."></textarea>
        </div>
    </div>
</div>
<script src="assets/common.js?v=20261021c"></script>
<script src="assets/review.js?v=20261021c"></script>
</body>
</html>
