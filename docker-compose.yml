services:
  playwright-runner:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: scraper
    volumes:
      - ./data/td:/data
      - ./data/db:/db
      - ./scraper/app:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
    # Optional: if you want to keep the container running for debugging
    # tty: true
    ipc: host                # Recommended for Chromium stability
    init: true               # Prevents zombie processes (PID=1 handling)
    cap_add:
      - SYS_ADMIN            # Helps avoid Chromium launch errors during dev

  dipterv:
    image: php:8.2-apache
    container_name: php-apache
    volumes:
      - ./data/td:/data
      - ./data/db:/db
      - ./reviewer/html:/var/www/html
      - ./reviewer/entrypoint.sh:/entrypoint.sh
    ports:
      - "8081:80"
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    command: ["apache2-foreground"]

  supervisor-gui:
    build:
      context: ./supervisor
      dockerfile: Dockerfile
    container_name: supervisor-gui
    volumes:
      - ./data/db:/db:ro     # read-only: this service never writes the database
      - ./supervisor/html:/var/www/html:ro   # code is edited on the host, no rebuild needed
    ports:
      - "8083:80"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    restart: unless-stopped

  sqlite-web:
    image: tomdesinto/sqliteweb
    container_name: sqlite-web
    ports:
      - "8082:8080"
    volumes:
      - ./data/db:/db:ro
    command: descriptions.sqlite
    restart: unless-stopped