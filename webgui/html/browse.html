<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="browse-wrap">
    <div id="toolbar">
        <button type="button" class="btn" data-switch-mode="review">Review</button>
        <span class="toolbar-label">Reviewer</span>
        <select id="reviewer-select" class="reviewer-select"></select>
        <span class="toolbar-label">Filters</span>
        <button type="button" class="filter-toggle active" data-filter="go">Go</button>
        <button type="button" class="filter-toggle active" data-filter="nogo">No-go</button>
        <button type="button" class="filter-toggle active" data-filter="undecided">Undecided</button>
        <button type="button" class="filter-toggle" data-filter="last">last</button>
    </div>
    <div id="table-wrapper">
        <table id="docs" class="display"></table>
    </div>
</div>
<script src="assets/common.js"></script>
<script src="assets/browse.js"></script>
</body>
</html>
